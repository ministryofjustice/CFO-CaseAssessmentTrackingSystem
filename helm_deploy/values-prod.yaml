serviceAccountName: hmpps-cfo-case-assessment-tracking-system-prod

generic-service:
  serviceAccountName: hmpps-cfo-case-assessment-tracking-system-prod
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 70
    scaleUpStabilizationWindowSeconds: 60
  scheduledDowntime:
    enabled: false
  ingress:
    host: hmpps-cfo-case-assessment-tracking-system-prod.live.cloud-platform.service.justice.gov.uk
    className: modsec
    modsecurity_audit_enabled: true
  allowlist: null # Production is accessible publicly - external providers, prison and probation staff, and our many hubs
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 1500m
      memory: 2Gi
  env:
    DOTNET_ENVIRONMENT: "Production"
    Sentry__Environment: "Production-CloudPlatform"
    # Fully-qualified in-cluster DNS (<service>.<namespace>.svc.cluster.local)
    # so this matches NO_PROXY and bypasses the egress-controls Envoy proxy.
    WorkerOptions__BaseUrl: "http://cats-worker.hmpps-cfo-case-assessment-tracking-system-prod.svc.cluster.local:8080"
    DMS__ApplicationUrl: "https://dms-api.co-financing.org"

worker:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    DOTNET_ENVIRONMENT: "Production"
    Sentry__Environment: "Production-CloudPlatform"
    Features__PresenceHub__RelayUserPresenceNotifications: "false"

consumers:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    DOTNET_ENVIRONMENT: "Production"
    Sentry__Environment: "Production-CloudPlatform"
    Features__PresenceHub__RelayUserPresenceNotifications: "false"

# RDS bridge - disabled in non-development environments
rdsPortForward:
  enabled: false

# Redis bridge - disabled in non-development environments
redisPortForward:
  enabled: false

generic-prometheus-alerts:
  alertSeverity: hmpps-cfo-alerts
  rdsAlertsDatabases:
    hmpps-cfo-case-assessment-tracking-system-db-production: prod sql server
  elastiCacheAlertsClusterIds:
    cp-700d1be140a68b36-001: prod redis cluster node 1 (primary)
    cp-700d1be140a68b36-002: prod redis cluster node 2 (replica)