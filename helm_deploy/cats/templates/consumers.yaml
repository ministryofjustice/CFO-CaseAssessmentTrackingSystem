{{- range $key, $d := .Values.consumers.deployments }}
{{- $name := $d.name | default (printf "cats-consumers-%s" $key) }}
{{- $strategy := $d.strategy | default "RollingUpdate" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $d.replicas | default 1 }}
  revisionHistoryLimit: 2
  minReadySeconds: 10
  # Recreate terminates the old pods and waits for them to be gone before starting new ones.
  # Use it (with replicas: 1) for consumers that must never run concurrently, e.g. payment.
  # RollingUpdate is safe for competing consumers.
  strategy:
    type: {{ $strategy }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      serviceAccountName: {{ $.Values.serviceAccountName }}
      {{- with $d.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      containers:
        - name: {{ $name }}
          # Combined image (Dockerfile) with a command override to run the Consumers.
          image: "{{ $.Values.consumers.image.repository }}:{{ $.Values.consumers.image.tag | default $.Chart.AppVersion }}"
          command: ["dotnet", "/app/consumers/Cfo.Cats.Consumers.dll", "--contentRoot", "/app/consumers"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /alive
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml ($d.resources | default $.Values.consumers.resources) | nindent 12 }}
          env:
            {{- include "cats.databaseEnv" $ | nindent 12 }}
            {{- include "cats.namespaceSecretsEnv" $.Values.consumers.namespace_secrets | nindent 12 }}
            - name: Sentry__Release
              value: {{ $.Chart.AppVersion | quote }}
            - name: AppConfigurationSettings__Version
              value: {{ $.Chart.AppVersion | quote }}
            {{- range $envKey, $val := merge (dict) ($d.env | default dict) $.Values.consumers.env }}
            - name: {{ $envKey }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $i, $c := $d.include }}
            - name: Consumers__Include__{{ $i }}
              value: {{ $c | quote }}
            {{- end }}
            {{- range $i, $c := $d.exclude }}
            - name: Consumers__Exclude__{{ $i }}
              value: {{ $c | quote }}
            {{- end }}
            {{- with $d.shutdownTimeoutSeconds }}
            - name: shutdownTimeoutSeconds
              value: {{ . | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $name }}
{{- end }}
