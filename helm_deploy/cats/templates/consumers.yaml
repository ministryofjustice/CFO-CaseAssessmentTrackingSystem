apiVersion: apps/v1
kind: Deployment
metadata:
  name: cats-consumers
  labels:
    app: cats-consumers
spec:
  replicas: {{ .Values.consumers.replicaCount | default 1 }}
  revisionHistoryLimit: 2
  minReadySeconds: 10
  # RollingUpdate is safe here: the Rebus consumers are competing consumers, so
  # briefly running old and new pods together during a rollout is acceptable.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: cats-consumers
  template:
    metadata:
      labels:
        app: cats-consumers
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
      containers:
        - name: cats-consumers
          # Combined image (Dockerfile) with a command override to run the Consumers.
          image: "{{ .Values.consumers.image.repository }}:{{ .Values.consumers.image.tag | default .Chart.AppVersion }}"
          command: ["dotnet", "/app/consumers/Cfo.Cats.Consumers.dll", "--contentRoot", "/app/consumers"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /alive
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.consumers.resources | nindent 12 }}
          env:
            {{- include "cats.databaseEnv" . | nindent 12 }}
            {{- include "cats.namespaceSecretsEnv" .Values.consumers.namespace_secrets | nindent 12 }}
            - name: Sentry__Release
              value: {{ .Chart.AppVersion | quote }}
            - name: AppConfigurationSettings__Version
              value: {{ .Chart.AppVersion | quote }}
            {{- range $key, $val := .Values.consumers.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cats-consumers
  labels:
    app: cats-consumers
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: cats-consumers
